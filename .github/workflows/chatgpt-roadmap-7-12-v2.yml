      - name: Improve tester audio and incremental ZIP audio
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/AudioStore.kt')
          s = p.read_text()
          if 'import android.media.MediaMetadataRetriever' not in s:
              s = s.replace('import android.media.MediaPlayer\n', 'import android.media.MediaPlayer\nimport android.media.MediaMetadataRetriever\nimport android.os.SystemClock\n')
          s = s.replace('''    private var player: MediaPlayer? = null\n''', '''    private var player: MediaPlayer? = null\n    private var recordingStartedAtElapsed: Long = 0L\n''', 1)
          old = '''    private fun startRecordingTo(file: File) {\n\n        currentFile = file\n\n        recorder = MediaRecorder(context).apply {'''
          new = '''    private fun startRecordingTo(file: File) {\n\n        if (recorder != null) stopRecording()\n        if (file.exists()) file.delete()\n        currentFile = file\n        recordingStartedAtElapsed = SystemClock.elapsedRealtime()\n\n        recorder = MediaRecorder(context).apply {'''
          if old not in s:
              raise SystemExit('audio start anchor not found')
          s = s.replace(old, new, 1)
          old_start = s.index('    fun stopRecording() {')
          old_end = s.index('\n    fun hasAudio(', old_start)
          replacement = '''    fun stopRecording(): Boolean {\n        val file = currentFile\n        val activeRecorder = recorder\n        recorder = null\n        currentFile = null\n        recordingStartedAtElapsed = 0L\n        if (activeRecorder == null) return file?.let { it.exists() && it.length() > 0L } ?: false\n        val stopped = try {\n            activeRecorder.stop()\n            true\n        } catch (_: RuntimeException) {\n            false\n        } finally {\n            runCatching { activeRecorder.release() }\n        }\n        if (!stopped || file == null || !file.exists() || file.length() <= 0L) {\n            file?.delete()\n            return false\n        }\n        return true\n    }\n\n    fun recordingDurationMs(): Long =\n        if (recordingStartedAtElapsed > 0L) SystemClock.elapsedRealtime() - recordingStartedAtElapsed else 0L\n\n    fun audioDurationMs(entryId: Int, testerName: String): Long =\n        mediaDurationMs(audioFile(entryId, testerName))\n\n    fun proposedEntryAudioDurationMs(localId: String, testerName: String): Long =\n        mediaDurationMs(proposedEntryAudioFile(localId, testerName))\n\n    private fun mediaDurationMs(file: File): Long {\n        if (!file.exists() || file.length() <= 0L) return 0L\n        val retriever = MediaMetadataRetriever()\n        return try {\n            retriever.setDataSource(file.absolutePath)\n            retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L\n        } catch (_: Exception) {\n            0L\n        } finally {\n            runCatching { retriever.release() }\n        }\n    }\n\n    fun countTesterAudioFilesAfter(testerName: String, afterMillis: Long): Int {\n        val safeName = testerName.trim()\n            .replace("[^A-Za-z0-9_-]".toRegex(), "_")\n            .ifBlank { "testeur" }\n        val suffix = "_${safeName}.m4a"\n        return listAudioFiles().count { file ->\n            file.length() > 0L &&\n                file.name.endsWith(suffix, ignoreCase = true) &&\n                file.lastModified() > afterMillis\n        }\n    }\n'''
          s = s[:old_start] + replacement + s[old_end:]
          s = s.replace('''        return audioFile(entryId, testerName).exists()''', '''        return audioFile(entryId, testerName).let { it.exists() && it.length() > 0L }''', 1)
          s = s.replace('''                appendLine("Taille : ${file.length()} octets")\n''', '''                appendLine("Taille : ${file.length()} octets")\n                appendLine("Durée : ${formatAudioDuration(mediaDurationMs(file))}")\n''', 1)
          old = '''    fun createTesterExportZip(\n        testerName: String,\n        exportText: String\n    ): File {'''
          new = '''    fun createTesterExportZip(\n        testerName: String,\n        exportText: String,\n        audioAfterMillis: Long? = null\n    ): File {\n        val effectiveAudioAfterMillis = audioAfterMillis\n            ?: ExportHistoryStore(context).lastSharedAtMillis()'''
          if old not in s:
              raise SystemExit('zip signature anchor not found')
          s = s.replace(old, new, 1)
          old = '''                                file.name.endsWith(\n                                    testerSuffix,\n                                    ignoreCase = true\n                                )\n'''
          new = '''                                file.name.endsWith(\n                                    testerSuffix,\n                                    ignoreCase = true\n                                ) &&\n                                file.lastModified() > effectiveAudioAfterMillis\n'''
          if old not in s:
              raise SystemExit('zip audio filter anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Add UI preview quality audit audio feedback and dark palette
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text()
          start = s.index('private val DarkColors = darkColorScheme(')
          end = s.index('\n)\n\nclass MainActivity', start) + 2
          s = s[:start] + '''private val DarkColors = darkColorScheme(\n    primary = Color(0xFF9BD8B5),\n    onPrimary = Color(0xFF083522),\n    primaryContainer = Color(0xFF174D35),\n    onPrimaryContainer = Color(0xFFDCEEE2),\n    secondary = Color(0xFFF0C96A),\n    onSecondary = Color(0xFF3B2F08),\n    secondaryContainer = Color(0xFF5A4815),\n    onSecondaryContainer = Color(0xFFFFEFC4),\n    background = Color(0xFF101713),\n    onBackground = Color(0xFFE5ECE7),\n    surface = Color(0xFF151D18),\n    onSurface = Color(0xFFE5ECE7),\n    surfaceVariant = Color(0xFF26332B),\n    onSurfaceVariant = Color(0xFFC4CEC7),\n    outline = Color(0xFF89968E)\n)''' + s[end:]

          d0 = s.index('private fun DetailScreen(')
          d1 = s.index('private val DELETION_REASONS_FR', d0)
          detail = s[d0:d1]
          anchor = '''                    if (accessLevel == AccessLevel.TESTER) {\n                        if (!isRecording) {'''
          if anchor not in detail:
              raise SystemExit('detail recording anchor not found')
          detail = detail.replace(anchor, '''                    if (accessLevel == AccessLevel.TESTER) {\n                        if (isRecording) {\n                            Text(\n                                text = "● ${strings.recordPronunciation}",\n                                style = MaterialTheme.typography.labelMedium,\n                                fontWeight = FontWeight.Bold,\n                                color = MaterialTheme.colorScheme.error\n                            )\n                            Spacer(Modifier.height(6.dp))\n                        }\n                        if (!isRecording) {''', 1)
          anchor = '''                        if (\n                            hasAudio &&\n                            !isRecording &&\n                            accessLevel != AccessLevel.GUEST\n                        ) {\n                            Spacer(Modifier.height(8.dp))\n\n                            OutlinedButton('''
          if anchor not in detail:
              raise SystemExit('detail saved audio anchor not found')
          detail = detail.replace(anchor, '''                        if (\n                            hasAudio &&\n                            !isRecording &&\n                            accessLevel != AccessLevel.GUEST\n                        ) {\n                            Spacer(Modifier.height(8.dp))\n                            val savedAudioDuration = audioStore.audioDurationMs(entry.id, testerName)\n                            if (savedAudioDuration > 0L) {\n                                Text(\n                                    text = "⏱ ${formatAudioDuration(savedAudioDuration)}",\n                                    style = MaterialTheme.typography.bodySmall,\n                                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                                )\n                                Spacer(Modifier.height(6.dp))\n                            }\n\n                            OutlinedButton(''', 1)
          s = s[:d0] + detail + s[d1:]

          c0 = s.index('private fun CorrectionsScreen(')
          c1 = s.index('@Composable\nprivate fun TesterAccessCodeDialog', c0)
          corr = s[c0:c1]
          state_anchor = '''    var pendingNewEntryCancellation by remember { mutableStateOf<NewEntryProposal?>(null) }\n\n    LazyColumn('''
          if state_anchor not in corr:
              raise SystemExit('corrections state anchor not found')
          corr = corr.replace(state_anchor, '''    var pendingNewEntryCancellation by remember { mutableStateOf<NewEntryProposal?>(null) }\n    val correctionsContext = LocalContext.current\n    val exportHistoryStore = remember(correctionsContext) { ExportHistoryStore(correctionsContext) }\n    var lastExportAtMillis by remember { mutableStateOf(exportHistoryStore.lastSharedAtMillis()) }\n    val pendingValidations = remember(lastExportAtMillis, validatedReviewCount) {\n        ReviewStore(correctionsContext).all().count { action ->\n            action.createdAt > lastExportAtMillis && action.action == ReviewActionType.VALIDATED\n        }\n    }\n    val pendingCorrections = remember(lastExportAtMillis, correctionProposals) {\n        correctionProposals.count { it.createdAt > lastExportAtMillis && it.hasChanges() }\n    }\n    val pendingDeletions = remember(lastExportAtMillis, deletionProposals) {\n        deletionProposals.count { it.createdAt > lastExportAtMillis }\n    }\n    val pendingNewEntries = remember(lastExportAtMillis, newEntryProposals) {\n        newEntryProposals.count { it.createdAt > lastExportAtMillis }\n    }\n    val pendingAudioFiles = remember(lastExportAtMillis, testerName) {\n        audioStore.countTesterAudioFilesAfter(testerName, lastExportAtMillis)\n    }\n    val pendingExportActions = pendingValidations + pendingCorrections + pendingDeletions + pendingNewEntries\n    val qualityAudit = remember(existingEntries) { auditDictionaryEntries(existingEntries) }\n    var showExportPreview by remember { mutableStateOf(false) }\n\n    LazyColumn(''', 1)
          quality_anchor = '''            Spacer(Modifier.height(14.dp))\n\n            if (correctionProposals.isNotEmpty()) {'''
          if quality_anchor not in corr:
              raise SystemExit('quality card anchor not found')
          corr = corr.replace(quality_anchor, '''            Spacer(Modifier.height(14.dp))\n\n            DictionaryQualitySummaryCard(qualityAudit)\n            Spacer(Modifier.height(8.dp))\n            Text(\n                text = formatExportTimestamp(lastExportAtMillis),\n                style = MaterialTheme.typography.bodySmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant\n            )\n            Text(\n                text = "À exporter : $pendingExportActions action(s), $pendingAudioFiles audio(s)",\n                style = MaterialTheme.typography.bodySmall,\n                fontWeight = FontWeight.SemiBold,\n                color = MaterialTheme.colorScheme.primary\n            )\n\n            Spacer(Modifier.height(14.dp))\n\n            if (correctionProposals.isNotEmpty()) {''', 1)
          corr = corr.replace('enabled = correctionCount > 0,', 'enabled = pendingExportActions > 0 || pendingAudioFiles > 0,', 1)
          corr = corr.replace('onClick = onExportCorrections\n', 'onClick = { showExportPreview = true }\n', 1)
          dialog_anchor = '''    pendingCancellation?.let { proposal ->'''
          if dialog_anchor not in corr:
              raise SystemExit('export preview anchor not found')
          corr = corr.replace(dialog_anchor, '''    if (showExportPreview) {\n        TesterExportPreviewDialog(\n            lastExportAtMillis = lastExportAtMillis,\n            validations = pendingValidations,\n            corrections = pendingCorrections,\n            deletions = pendingDeletions,\n            newEntries = pendingNewEntries,\n            audioFiles = pendingAudioFiles,\n            onDismiss = { showExportPreview = false },\n            onConfirm = {\n                showExportPreview = false\n                onExportCorrections()\n                lastExportAtMillis = exportHistoryStore.lastSharedAtMillis()\n            }\n        )\n    }\n\n''' + dialog_anchor, 1)
          s = s[:c0] + corr + s[c1:]
          p.write_text(s)
          PY
      - name: Add release readiness script
        shell: bash
        run: |
          mkdir -p scripts
          cat > scripts/check_release_readiness.py <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(__file__).resolve().parents[1]
          errors = []
          gradle = (root / 'app/build.gradle.kts').read_text(encoding='utf-8')
          db_code = (root / 'app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt').read_text(encoding='utf-8')
          db_asset = root / 'app/src/main/assets/SaamakaDico_v11_25.db'
          if not re.search(r'versionCode\s*=\s*357\b', gradle): errors.append('versionCode doit être 357')
          if not re.search(r'versionName\s*=\s*"3\.9\.0"', gradle): errors.append('versionName doit être 3.9.0')
          if not re.search(r'EMBEDDED_DB_VERSION\s*=\s*6\b', db_code): errors.append('EMBEDDED_DB_VERSION doit être 6')
          if not db_asset.exists() or db_asset.stat().st_size <= 0: errors.append('base SQLite embarquée absente ou vide')
          if errors:
              print('RELEASE NOT READY')
              for error in errors: print('-', error)
              sys.exit(1)
          print('RELEASE READY CHECKS OK: versionCode=357 versionName=3.9.0 embeddedDb=6 asset=OK')
          PY
          python scripts/check_release_readiness.py
      - name: SQLite integrity
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sqlite3 >/dev/null
          test "$(sqlite3 app/src/main/assets/SaamakaDico_v11_25.db 'PRAGMA quick_check;')" = "ok"
      - name: Tests and release builds
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleRelease bundleRelease --no-daemon
      - name: Verify protected release data unchanged
        shell: bash
        run: test -z "$(git diff --name-only -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt)"
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-roadmap-7-12.yml .github/workflows/chatgpt-roadmap-7-12-v2.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add \
            app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt \
            app/src/main/java/com/saamaka/dico/testeurs/AudioStore.kt \
            app/src/main/java/com/saamaka/dico/testeurs/DictionaryQualityAudit.kt \
            app/src/main/java/com/saamaka/dico/testeurs/RoadmapEnhancements.kt \
            app/src/main/java/com/saamaka/dico/testeurs/billing/PremiumBillingManager.kt \
            app/src/test/java/com/saamaka/dico/testeurs/DictionaryQualityAuditTest.kt \
            scripts/check_release_readiness.py \
            .github/workflows/chatgpt-roadmap-7-12.yml \
            .github/workflows/chatgpt-roadmap-7-12-v2.yml
          git commit -m "feat(app): finish tester quality and release hardening"
          git push origin master
