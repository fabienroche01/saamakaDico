name: ChatGPT fix learning word of day
on:
  push:
    branches: ["master"]
    paths: [".github/workflows/chatgpt-fix-learning-word-of-day.yml"]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make word of day open detail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text()
          start = s.index('                                "WORD_OF_DAY" -> {')
          end = s.index('                                "PHRASES" -> {', start)
          block = s[start:end]
          old = 'modifier = Modifier.fillMaxWidth(),'
          new = '''modifier = Modifier\n                                            .fillMaxWidth()\n                                            .clickable(enabled = dailyEntry != null) {\n                                                dailyEntry?.let { openEntry(it) }\n                                            },'''
          if old not in block:
              raise SystemExit('word-of-day card modifier not found')
          block = block.replace(old, new, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Run tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --no-daemon
      - name: Verify protected files unchanged
        shell: bash
        run: |
          git diff --exit-code -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/chatgpt-fix-learning-word-of-day.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt .github/workflows/chatgpt-fix-learning-word-of-day.yml
          git commit -m "fix(learn): open word of day detail"
          git push origin master
