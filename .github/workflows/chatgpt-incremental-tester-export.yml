name: ChatGPT incremental tester export
on:
  push:
    branches: ["master"]
    paths: [".github/workflows/chatgpt-incremental-tester-export.yml"]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply incremental export fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ExportHistoryStore: derive cursor from most recent shared export.
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/ExportHistoryStore.kt')
          s = p.read_text()
          marker = '    fun markShareLaunched(\n'
          insert = '''    fun lastSharedAtMillis(): Long {\n        val history = readHistory()\n        val formatter = SimpleDateFormat(\n            "yyyy-MM-dd'T'HH:mm:ss",\n            Locale.ROOT\n        )\n\n        var latest = 0L\n\n        for (i in 0 until history.length()) {\n            val item = history.optJSONObject(i) ?: continue\n            if (item.optString("status") != "SHARE_LAUNCHED") continue\n\n            val timestamp = item.optString("timestamp")\n            val parsed = runCatching {\n                formatter.parse(timestamp)?.time ?: 0L\n            }.getOrDefault(0L)\n\n            if (parsed > latest) latest = parsed\n        }\n\n        return latest\n    }\n\n'''
          if 'fun lastSharedAtMillis()' not in s:
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          # ReviewStore incremental export.
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/ReviewStore.kt')
          s = p.read_text()
          s = s.replace('    fun exportText(): String {\n        // Corrections are exported from CorrectionStore, which applies the shared hasChanges rule.\n        val actions = all().filter { it.action != ReviewActionType.CORRECTED }',
                        '    fun exportText(sinceMillis: Long = 0L): String {\n        // Corrections are exported from CorrectionStore, which applies the shared hasChanges rule.\n        val actions = all().filter { it.action != ReviewActionType.CORRECTED && it.createdAt > sinceMillis }', 1)
          p.write_text(s)

          # CorrectionStore incremental export.
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/repository/CorrectionStore.kt')
          s = p.read_text()
          s = s.replace('    fun exportText(): String = correctionExportText(all())',
                        '    fun exportText(sinceMillis: Long = 0L): String =\n        correctionExportText(all().filter { it.createdAt > sinceMillis })', 1)
          p.write_text(s)

          # DeletionProposalStore incremental export.
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/repository/DeletionProposalStore.kt')
          s = p.read_text()
          s = s.replace('    fun exportText(): String {\n        val proposals = all()',
                        '    fun exportText(sinceMillis: Long = 0L): String {\n        val proposals = all().filter { it.createdAt > sinceMillis }', 1)
          p.write_text(s)

          # NewEntryProposalStore incremental export.
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/repository/NewEntryProposalStore.kt')
          s = p.read_text()
          s = s.replace('    fun exportText(): String {\n        val proposals = all()',
                        '    fun exportText(sinceMillis: Long = 0L): String {\n        val proposals = all().filter { it.createdAt > sinceMillis }', 1)
          p.write_text(s)

          # MainActivity: build export from actions after the last shared ZIP.
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text()
          old = '''                        onExportCorrections = {\n                            val exportText = buildString {\n                                appendLine(reviewStore.exportText())\n                                appendLine()\n                                appendLine(correctionStore.exportText())\n                                appendLine()\n                                appendLine(deletionProposalStore.exportText())\n                                appendLine()\n                                appendLine(newEntryProposalStore.exportText())\n                                appendLine()\n                                appendLine(audioStore.exportAudioSummary())\n                            }\n\n                            val zipFile = audioStore.createTesterExportZip(\n                                testerName = testerName,\n                                exportText = exportText\n                            )\n\n                            val exportHistoryStore = ExportHistoryStore(context)\n'''
          new = '''                        onExportCorrections = {\n                            val exportHistoryStore = ExportHistoryStore(context)\n                            val lastSharedAt = exportHistoryStore.lastSharedAtMillis()\n\n                            val exportText = buildString {\n                                appendLine(reviewStore.exportText(lastSharedAt))\n                                appendLine()\n                                appendLine(correctionStore.exportText(lastSharedAt))\n                                appendLine()\n                                appendLine(deletionProposalStore.exportText(lastSharedAt))\n                                appendLine()\n                                appendLine(newEntryProposalStore.exportText(lastSharedAt))\n                                appendLine()\n                                appendLine(audioStore.exportAudioSummary())\n                            }\n\n                            val zipFile = audioStore.createTesterExportZip(\n                                testerName = testerName,\n                                exportText = exportText\n                            )\n'''
          if old not in s:
              raise SystemExit('export block not found in MainActivity')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --no-daemon
      - name: Verify protected files unchanged
        shell: bash
        run: |
          git diff --exit-code -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/chatgpt-incremental-tester-export.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add app/src/main/java/com/saamaka/dico/testeurs/ExportHistoryStore.kt app/src/main/java/com/saamaka/dico/testeurs/ReviewStore.kt app/src/main/java/com/saamaka/dico/testeurs/repository/CorrectionStore.kt app/src/main/java/com/saamaka/dico/testeurs/repository/DeletionProposalStore.kt app/src/main/java/com/saamaka/dico/testeurs/repository/NewEntryProposalStore.kt app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt .github/workflows/chatgpt-incremental-tester-export.yml
          git commit -m "fix(tester): export only new review actions"
          git push origin master
