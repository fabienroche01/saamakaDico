name: ChatGPT validated word of day correction
on:
  push:
    branches: ["master"]
    paths: [".github/workflows/chatgpt-validated-word-day-v2.yml"]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restrict word of day to validated entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text()
          start = s.index('                        val learningWordOfDay = remember(quizEntries) {')
          end = s.index('                        val phraseEntries = remember(allEntries) {', start)
          replacement = '''                        val validatedLearningWordEntries = remember(quizEntries, deletionProposalEntryIds) {
                            quizEntries.filter { entry ->
                                entry.valide.trim().equals("O", ignoreCase = true) &&
                                    entry.id !in deletionProposalEntryIds
                            }
                        }

                        val learningWordOfDay = remember(validatedLearningWordEntries) {
                            if (validatedLearningWordEntries.isEmpty()) null
                            else {
                                val calendar = java.util.Calendar.getInstance()
                                val seed = calendar.get(java.util.Calendar.YEAR) * 366L +
                                    calendar.get(java.util.Calendar.DAY_OF_YEAR)
                                validatedLearningWordEntries[(seed % validatedLearningWordEntries.size).toInt()]
                            }
                        }

'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Run tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --no-daemon
      - name: Verify protected files unchanged
        shell: bash
        run: |
          git diff --exit-code -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/chatgpt-validated-word-day-v2.yml
          rm -f .github/workflows/chatgpt-fix-word-of-day-validation.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt .github/workflows/chatgpt-validated-word-day-v2.yml .github/workflows/chatgpt-fix-word-of-day-validation.yml
          git commit -m "fix(learn): restrict word of day to validated entries"
          git push origin master
