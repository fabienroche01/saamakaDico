name: ChatGPT wire course quote screen

on:
  push:
    paths:
      - '.github/workflows/chatgpt-course-quote.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Wire course quote into Learn
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text(encoding='utf-8')

          if '"COURSE_QUOTE"' not in s:
              pattern = re.compile(r'(LearnAccessCard\("Quiz audio"[^\n]+\n)(\s*Spacer\(Modifier\.weight\(1f\)\)\n)')
              replacement = r'\1                                    LearnAccessCard("Cours en visio", "Demander un devis", "COURSE_QUOTE", learnSection, Modifier.weight(1f), ::launchLearningActivity)\n'
              s2, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit('quiz audio anchor not found')
              s = s2

          if '"COURSE_QUOTE" -> {' not in s:
              pattern2 = re.compile(r'(\}\s+else when \(learnSection\) \{\s*\n\s*)("QUIZ" -> \{)')
              replacement2 = r'\1"COURSE_QUOTE" -> {\n                                    CourseQuoteScreen()\n                                }\n\n                                \2'
              s2, count = pattern2.subn(replacement2, s, count=1)
              if count != 1:
                  raise SystemExit('learning section anchor not found')
              s = s2

          p.write_text(s, encoding='utf-8')
          PY
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleRelease --no-daemon
      - name: Verify protected files
        run: git diff --exit-code HEAD -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Commit
        run: |
          rm -f .github/workflows/chatgpt-course-quote.yml
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add -A
          git commit -m "feat(learn): add Saamaka course quote request"
          git push origin HEAD:master
