name: ChatGPT wire course quote screen

on:
  push:
    paths:
      - '.github/workflows/chatgpt-course-quote.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Wire course quote into Learn
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''                                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                    LearnAccessCard("Quiz audio", appStrings.listen.replace("▶", "").trim(), "AUDIO", learnSection, Modifier.weight(1f), ::launchLearningActivity)
                                    Spacer(Modifier.weight(1f))
                                }
                            }

                            Spacer(Modifier.height(18.dp))'''
          new = '''                                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                    LearnAccessCard("Quiz audio", appStrings.listen.replace("▶", "").trim(), "AUDIO", learnSection, Modifier.weight(1f), ::launchLearningActivity)
                                    LearnAccessCard("Cours en visio", "Demander un devis", "COURSE_QUOTE", learnSection, Modifier.weight(1f), ::launchLearningActivity)
                                }
                            }

                            Spacer(Modifier.height(18.dp))'''
          if old not in s:
              raise SystemExit('activity card anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''                            } else when (learnSection) {

                                "QUIZ" -> {'''
          new2 = '''                            } else when (learnSection) {

                                "COURSE_QUOTE" -> {
                                    CourseQuoteScreen()
                                }

                                "QUIZ" -> {'''
          if old2 not in s:
              raise SystemExit('section anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleRelease --no-daemon
      - name: Verify protected files
        run: git diff --exit-code HEAD -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Commit
        run: |
          rm -f .github/workflows/chatgpt-course-quote.yml
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add -A
          git commit -m "feat(learn): add Saamaka course quote request"
          git push origin HEAD:master
