          )

          replace_once(
              '''                        onClearValidations = {\n                            validationStore.clear()\n                            validatedCount = 0\n                            Toast.makeText(\n                                context,\n                                appStrings.ui(UiCopyKey.LOCAL_VALIDATIONS_CLEARED),\n                                Toast.LENGTH_SHORT\n                            ).show()\n                        }\n                    )\n                }''',
