          )

          replace_once(
              '''                            Toast.makeText(\n                                context,\n                                appStrings.ui(UiCopyKey.VALIDATED_BY, reviewerName),\n                                Toast.LENGTH_SHORT\n                            ).show()\n\n                            openNextUnvalidated()\n                        },\n                        onNext = { openNextUnvalidated() },''',
