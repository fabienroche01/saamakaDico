              '''    validatedReviewCount: Int,\n    correctedReviewCount: Int,\n    treatedWordCount: Int,\n    deletionCount: Int,\n    newEntryCount: Int,\n    onOpenDeletionProposal: (DeletionProposal) -> Unit,''',
              'corrections screen params'
          )

          replace_once(
              '''                        StatCard(\n                            modifier = Modifier.weight(1f),\n                            value = "$total",\n                            label = strings.ui(UiCopyKey.TESTER_WORDS)\n                        )''',
              '''                        StatCard(\n                            modifier = Modifier.weight(1f),\n                            value = "$treatedWordCount / $total",\n                            label = strings.ui(UiCopyKey.TESTER_WORDS)\n                        )''',
              'treated unique count'
          )

          replace_once(
              '''                    Spacer(Modifier.height(8.dp))\n\n                    Text(\n                        text = strings.ui(UiCopyKey.LOCAL_VALIDATIONS_COUNT, validatedCount),''',
              '''                    Spacer(Modifier.height(8.dp))\n\n                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(8.dp)\n                    ) {\n                        StatCard(\n                            modifier = Modifier.weight(1f),\n                            value = "$deletionCount",\n                            label = strings.proposedDeletionsSection\n                        )\n                        StatCard(\n                            modifier = Modifier.weight(1f),\n                            value = "$newEntryCount",\n                            label = strings.proposedNewEntries\n                        )\n                    }\n\n                    Spacer(Modifier.height(8.dp))\n\n                    Text(\n                        text = strings.ui(UiCopyKey.LOCAL_VALIDATIONS_COUNT, validatedCount),''',
              'deletion and new entry stats'
          )

          replace_once(
              '''    initiallyFavorite: Boolean,\n    classification: MissionEntryClassification,\n    initialDeletionProposal: DeletionProposal?,''',
              '''    initiallyFavorite: Boolean,\n    classification: MissionEntryClassification,\n    testerStatus: TesterEntryStatus,\n    canGoPrevious: Boolean,\n    canGoNext: Boolean,\n    initialDeletionProposal: DeletionProposal?,''',
              'detail params status'
          )

          replace_once(
              '''    onCancelDeletionProposal: () -> Unit,\n    onValidate: () -> Unit,\n    onNext: () -> Unit,''',
              '''    onCancelDeletionProposal: () -> Unit,\n    onValidate: () -> Unit,\n    onPrevious: () -> Unit,\n    onNext: () -> Unit,''',
              'detail previous callback'
          )

          replace_once(
              '''            Surface(\n                shape = RoundedCornerShape(50),\n                color = if (deletionProposal != null) Color(0xFFFFE1E1) else when (classification.visualStatus) {\n                    MissionVisualStatus.DOUBTFUL -> Color(0xFFFFEFC4)\n                    MissionVisualStatus.TO_COMPLETE -> Color(0xFFFFE1E1)\n                    MissionVisualStatus.ALREADY_VALIDATED -> Color(0xFFDCEEE2)\n                    MissionVisualStatus.NEW -> MaterialTheme.colorScheme.surfaceVariant\n                }\n            ) {\n                Text(\n                    text = deletionProposal?.let { strings.deletionProposed }\n                        ?: strings.missionStatusLabel(classification.visualStatus),\n                    modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp),\n                    style = MaterialTheme.typography.labelLarge,\n                    fontWeight = FontWeight.Bold,\n                    color = if (deletionProposal != null) Color(0xFF8B2F2F) else when (classification.visualStatus) {\n                        MissionVisualStatus.DOUBTFUL -> Color(0xFF8A6712)\n                        MissionVisualStatus.TO_COMPLETE -> Color(0xFF8B2F2F)\n                        else -> Color(0xFF0B5D3B)\n                    }\n                )\n            }''',
              '''            val effectiveTesterStatus = if (deletionProposal != null) {\n                TesterEntryStatus.DELETION_PROPOSED\n            } else {\n                testerStatus\n            }\n            Surface(\n                shape = RoundedCornerShape(50),\n                color = when (effectiveTesterStatus) {\n                    TesterEntryStatus.DELETION_PROPOSED -> Color(0xFFFFE1E1)\n                    TesterEntryStatus.CORRECTED -> Color(0xFFE8E1F7)\n                    TesterEntryStatus.VALIDATED -> Color(0xFFDCEEE2)\n                    TesterEntryStatus.TO_REVIEW -> Color(0xFFFFEFC4)\n                    TesterEntryStatus.UNTOUCHED -> MaterialTheme.colorScheme.surfaceVariant\n                }\n            ) {\n                Text(\n                    text = when (effectiveTesterStatus) {\n                        TesterEntryStatus.DELETION_PROPOSED -> strings.deletionProposed\n                        TesterEntryStatus.CORRECTED -> "✎ ${strings.corrections}"\n                        TesterEntryStatus.VALIDATED -> "✓ ${strings.validatedO}"\n                        TesterEntryStatus.TO_REVIEW -> strings.missionStatusLabel(classification.visualStatus)\n                        TesterEntryStatus.UNTOUCHED -> strings.missionStatusLabel(MissionVisualStatus.NEW)\n                    },\n                    modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp),\n                    style = MaterialTheme.typography.labelLarge,\n                    fontWeight = FontWeight.Bold,\n                    color = when (effectiveTesterStatus) {\n                        TesterEntryStatus.DELETION_PROPOSED -> Color(0xFF8B2F2F)\n                        TesterEntryStatus.CORRECTED -> Color(0xFF5D3B7A)\n                        TesterEntryStatus.TO_REVIEW -> Color(0xFF8A6712)\n                        else -> Color(0xFF0B5D3B)\n                    }\n                )\n            }''',
              'tester detail badge'
          )

          replace_once(
              '''                    OutlinedButton(\n                        modifier = Modifier.fillMaxWidth(),\n                        shape = RoundedCornerShape(14.dp),\n                        onClick = onNext\n                    ) {\n                        Icon(\n                            Icons.Default.SkipNext,\n                            contentDescription = null,\n                            tint = MaterialTheme.colorScheme.primary\n                        )\n\n                        Spacer(Modifier.width(8.dp))\n\n                        Text(strings.nextWord)\n                    }''',
              '''                    Row(\n                        modifier = Modifier.fillMaxWidth(),\n                        horizontalArrangement = Arrangement.spacedBy(8.dp)\n                    ) {\n                        OutlinedButton(\n                            modifier = Modifier.weight(1f),\n                            shape = RoundedCornerShape(14.dp),\n                            enabled = canGoPrevious,\n                            onClick = onPrevious\n                        ) {\n                            Icon(\n                                Icons.AutoMirrored.Filled.ArrowBack,\n                                contentDescription = null,\n                                tint = MaterialTheme.colorScheme.primary\n                            )\n                            Spacer(Modifier.width(6.dp))\n                            Text(strings.back.removePrefix("← "))\n                        }\n\n                        OutlinedButton(\n                            modifier = Modifier.weight(1f),\n                            shape = RoundedCornerShape(14.dp),\n                            enabled = canGoNext,\n                            onClick = onNext\n                        ) {\n                            Icon(\n                                Icons.Default.SkipNext,\n                                contentDescription = null,\n                                tint = MaterialTheme.colorScheme.primary\n                            )\n                            Spacer(Modifier.width(6.dp))\n                            Text(strings.nextWord)\n                        }\n                    }''',
              'previous next buttons'
          )

          replace_once(
              '''    onSelectedCategoryChange: (String?) -> Unit,\n    onBack: () -> Unit,\n    onOpen: (DictionaryEntry) -> Unit\n) {''',
              '''    onSelectedCategoryChange: (String?) -> Unit,\n    onBack: () -> Unit,\n    onOpen: (DictionaryEntry, List<DictionaryEntry>) -> Unit\n) {''',
              'categories callback signature'
          )

          replace_once(
              '''                        .clickable {\n                            onOpen(entry)\n                        },''',
              '''                        .clickable {\n                            onOpen(entry, categoryEntries)\n                        },''',
              'category open context'
          )

          p.write_text(s)
          PY

          cat > app/src/main/java/com/saamaka/dico/testeurs/TesterWorkflowState.kt <<'EOF'
          package com.saamaka.dico.testeurs

          internal enum class TesterEntryStatus {
              UNTOUCHED,
              VALIDATED,
              CORRECTED,
              DELETION_PROPOSED,
              TO_REVIEW
          }

          internal data class TesterProgressStats(
              val treatedEntryIds: Set<Int>,
              val validationCount: Int,
              val correctionCount: Int,
              val deletionCount: Int,
              val newEntryCount: Int
          ) {
              val treatedWordCount: Int get() = treatedEntryIds.size
          }

          internal fun testerEntryStatus(
              databaseValidated: Boolean,
              locallyValidated: Boolean,
              corrected: Boolean,
              deletionProposed: Boolean,
              toReview: Boolean
          ): TesterEntryStatus = when {
              deletionProposed -> TesterEntryStatus.DELETION_PROPOSED
              corrected -> TesterEntryStatus.CORRECTED
              databaseValidated || locallyValidated -> TesterEntryStatus.VALIDATED
              toReview -> TesterEntryStatus.TO_REVIEW
              else -> TesterEntryStatus.UNTOUCHED
          }

          internal fun adjacentEntryId(
              entryIds: List<Int>,
              currentId: Int,
              offset: Int
          ): Int? {
              if (offset == 0) return currentId.takeIf { it in entryIds }
              val currentIndex = entryIds.indexOf(currentId)
              if (currentIndex < 0) return null
              return entryIds.getOrNull(currentIndex + offset)
          }

          internal fun testerProgressStats(
              validatedIds: Set<Int>,
              correctedIds: Set<Int>,
              deletionIds: Set<Int>,
              newEntryCount: Int
          ): TesterProgressStats = TesterProgressStats(
              treatedEntryIds = validatedIds + correctedIds + deletionIds,
              validationCount = validatedIds.size,
              correctionCount = correctedIds.size,
              deletionCount = deletionIds.size,
              newEntryCount = newEntryCount.coerceAtLeast(0)
          )

          internal fun classificationNeedsReview(classification: MissionEntryClassification): Boolean =
              classification.visualStatus == MissionVisualStatus.DOUBTFUL ||
                  classification.visualStatus == MissionVisualStatus.TO_COMPLETE
          EOF

          cat > app/src/test/java/com/saamaka/dico/testeurs/TesterWorkflowStateTest.kt <<'EOF'
          package com.saamaka.dico.testeurs

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertNull
          import org.junit.Test

          class TesterWorkflowStateTest {
              @Test
              fun `deletion outranks correction and validation`() {
                  assertEquals(
                      TesterEntryStatus.DELETION_PROPOSED,
                      testerEntryStatus(true, true, true, true, true)
                  )
              }

              @Test
              fun `correction outranks validation`() {
                  assertEquals(
                      TesterEntryStatus.CORRECTED,
                      testerEntryStatus(true, true, true, false, false)
                  )
              }

              @Test
              fun `local validation is validated`() {
                  assertEquals(
                      TesterEntryStatus.VALIDATED,
                      testerEntryStatus(false, true, false, false, false)
                  )
              }

              @Test
              fun `review state is kept for untouched doubtful entry`() {
                  assertEquals(
                      TesterEntryStatus.TO_REVIEW,
                      testerEntryStatus(false, false, false, false, true)
                  )
              }

              @Test
              fun `adjacent navigation never wraps`() {
                  val ids = listOf(10, 20, 30)
                  assertEquals(10, adjacentEntryId(ids, 20, -1))
                  assertEquals(30, adjacentEntryId(ids, 20, 1))
                  assertNull(adjacentEntryId(ids, 10, -1))
                  assertNull(adjacentEntryId(ids, 30, 1))
              }

              @Test
              fun `treated words use unique dictionary ids`() {
                  val stats = testerProgressStats(
                      validatedIds = setOf(1, 2),
                      correctedIds = setOf(2, 3),
                      deletionIds = setOf(3, 4),
                      newEntryCount = 2
                  )
                  assertEquals(4, stats.treatedWordCount)
                  assertEquals(2, stats.validationCount)
                  assertEquals(2, stats.correctionCount)
                  assertEquals(2, stats.deletionCount)
                  assertEquals(2, stats.newEntryCount)
              }
          }
          EOF

      - name: Run unit tests and compile Android tests
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin

      - name: Verify protected files unchanged
        shell: bash
        run: |
          if ! git diff --quiet HEAD -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt; then
            echo 'Protected release/data file changed unexpectedly'
            git diff -- app/build.gradle.kts app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt \
                  app/src/main/java/com/saamaka/dico/testeurs/TesterWorkflowState.kt \
                  app/src/test/java/com/saamaka/dico/testeurs/TesterWorkflowStateTest.kt
          git commit -m 'feat(tester): improve review workflow and progress'
          git push origin HEAD:chatgpt/tester-workflow-priorities-1-3
