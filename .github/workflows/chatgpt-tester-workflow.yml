              'corrections progress wrapper'
          )

          replace_once(
              '''                        correctedReviewCount = correctionProposals.size,\n                        onOpenDeletionProposal = { proposal ->''',
              '''                        correctedReviewCount = correctionProposals.size,\n                        treatedWordCount = progress.treatedWordCount,\n                        deletionCount = progress.deletionCount,\n                        newEntryCount = progress.newEntryCount,\n                        onOpenDeletionProposal = { proposal ->''',
