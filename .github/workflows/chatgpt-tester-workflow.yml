          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '    var selectedEntry by remember { mutableStateOf<DictionaryEntry?>(null) }\n    var openCategory by remember { mutableStateOf<String?>(null) }',
              '    var selectedEntry by remember { mutableStateOf<DictionaryEntry?>(null) }\n    var detailNavigationIds by remember { mutableStateOf<List<Int>>(emptyList()) }\n    var openCategory by remember { mutableStateOf<String?>(null) }',
              'detail navigation state'
          )

