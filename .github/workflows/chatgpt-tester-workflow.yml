name: ChatGPT tester workflow patch

on:
  push:
    branches:
      - chatgpt/tester-workflow-priorities-1-3
    paths:
      - .github/workflows/chatgpt-tester-workflow.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tester-workflow-priorities-1-3
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply targeted tester UX patch
        shell: bash
        run: |
          python3 <<'PY'
