name: ChatGPT validated word of day fix
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch MainActivity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text()
          a = '                        val learningWordOfDay = remember(quizEntries) {'
          b = '                        val phraseEntries = remember(allEntries) {'
          start = s.index(a)
          end = s.index(b, start)
          new = '''                        val validatedLearningWordEntries = remember(quizEntries, deletionProposalEntryIds) {
                            quizEntries.filter { entry ->
                                entry.valide.trim().equals("O", ignoreCase = true) &&
                                    entry.id !in deletionProposalEntryIds
                            }
                        }

                        val learningWordOfDay = remember(validatedLearningWordEntries) {
                            if (validatedLearningWordEntries.isEmpty()) null
                            else {
                                val calendar = java.util.Calendar.getInstance()
                                val seed = calendar.get(java.util.Calendar.YEAR) * 366L +
                                    calendar.get(java.util.Calendar.DAY_OF_YEAR)
                                validatedLearningWordEntries[(seed % validatedLearningWordEntries.size).toInt()]
                            }
                        }

'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Test
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --no-daemon
      - name: Verify protected files
        shell: bash
        run: |
          git diff --exit-code -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/chatgpt-fix-word-of-day-validation.yml
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt .github/workflows/chatgpt-fix-word-of-day-validation.yml
          git commit -m 'fix(learn): restrict word of day to validated entries'
          git push origin master
