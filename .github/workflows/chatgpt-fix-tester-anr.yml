name: ChatGPT fix tester ANR

on:
  push:
    branches:
      - chatgpt/fix-tester-anr
    paths:
      - .github/workflows/chatgpt-fix-tester-anr.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-tester-anr
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply targeted performance fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '''    val correctionStore = remember { CorrectionStore(context) }\n    var correctionProposals by remember { mutableStateOf(correctionStore.all()) }\n    val deletionProposalStore = remember { DeletionProposalStore(context) }\n    var deletionProposals by remember { mutableStateOf(deletionProposalStore.all()) }\n    val newEntryProposalStore = remember { NewEntryProposalStore(context) }\n    var newEntryProposals by remember { mutableStateOf(newEntryProposalStore.all()) }''',
              '''    val correctionStore = remember { CorrectionStore(context) }\n    var correctionProposals by remember { mutableStateOf(correctionStore.all()) }\n    val correctedEntryIds = remember(correctionProposals) {\n        correctionProposals\n            .asSequence()\n            .filter { it.hasChanges() }\n            .map { it.entryId }\n            .toSet()\n    }\n    val deletionProposalStore = remember { DeletionProposalStore(context) }\n    var deletionProposals by remember { mutableStateOf(deletionProposalStore.all()) }\n    val deletionProposalEntryIds = remember(deletionProposals) {\n        deletionProposals.asSequence().map { it.entryId }.toSet()\n    }\n    val newEntryProposalStore = remember { NewEntryProposalStore(context) }\n    var newEntryProposals by remember { mutableStateOf(newEntryProposalStore.all()) }''',
              'proposal id caches'
          )

          replace_once(
              '''    val total = remember { database.countEntries() }\n    val allEntries: List<DictionaryEntry> = remember { database.allEntries() }\n    var quizScore by remember { mutableStateOf(0) }''',
              '''    val total = remember { database.countEntries() }\n    val allEntries: List<DictionaryEntry> = remember { database.allEntries() }\n    val entriesById = remember(allEntries) { allEntries.associateBy { it.id } }\n    var quizScore by remember { mutableStateOf(0) }''',
              'entry id index'
          )

          replace_once(
              '''    fun applyCorrection(entry: DictionaryEntry): DictionaryEntry {\n        val correction = correctionStore.latestForEntry(entry.id)\n            ?: return entry''',
              '''    fun applyCorrection(entry: DictionaryEntry): DictionaryEntry {\n        val correction = correctionProposals.firstOrNull { it.entryId == entry.id }\n            ?: return entry''',
              'avoid reparsing correction store'
          )

          replace_once(
              '''        val targetId = adjacentEntryId(detailNavigationIds, currentId, offset) ?: return\n        val target = allEntries.firstOrNull { it.id == targetId } ?: return\n        openEntry(target)''',
              '''        val targetId = adjacentEntryId(detailNavigationIds, currentId, offset) ?: return\n        val target = entriesById[targetId] ?: return\n        openEntry(target)''',
              'constant time adjacent lookup'
          )

          replace_once(
              '''                    val detailIndex = detailNavigationIds.indexOf(entry.id)\n                    val testerStatus = testerEntryStatus(\n                        databaseValidated = entry.valide.trim().equals("O", ignoreCase = true),\n                        locallyValidated = validationStore.isValidated(entry.id),\n                        corrected = correctionProposals.any { it.entryId == entry.id && it.hasChanges() },\n                        deletionProposed = deletionProposals.any { it.entryId == entry.id },\n                        toReview = classificationNeedsReview(\n                            classifyMissionEntry(\n                                entry = entry,\n                                hasLocalValidation = validationStore.isValidated(entry.id)\n                            )\n                        )\n                    )''',
              '''                    val detailIndex = detailNavigationIds.indexOf(entry.id)\n                    val locallyValidated = validationStore.isValidated(entry.id)\n                    val testerStatus = remember(\n                        entry.id,\n                        entry.valide,\n                        locallyValidated,\n                        correctedEntryIds,\n                        deletionProposalEntryIds\n                    ) {\n                        testerEntryStatus(\n                            databaseValidated = entry.valide.trim().equals("O", ignoreCase = true),\n                            locallyValidated = locallyValidated,\n                            corrected = entry.id in correctedEntryIds,\n                            deletionProposed = entry.id in deletionProposalEntryIds,\n                            toReview = classificationNeedsReview(\n                                classifyMissionEntry(\n                                    entry = entry,\n                                    hasLocalValidation = locallyValidated\n                                )\n                            )\n                        )\n                    }''',
              'memoize detail status'
          )

          replace_once(
              '''                        val progress = testerProgressStats(\n                            validatedIds = reviewStore.all()\n                                .filter { it.action == ReviewActionType.VALIDATED }\n                                .map { it.entryId }\n                                .toSet() + validationStore.ids(),\n                            correctedIds = correctionProposals\n                                .filter { it.hasChanges() }\n                                .map { it.entryId }\n                                .toSet(),\n                            deletionIds = deletionProposals.map { it.entryId }.toSet(),\n                            newEntryCount = newEntryProposals.size\n                        )''',
              '''                        val progress = remember(\n                            validatedCount,\n                            correctedEntryIds,\n                            deletionProposalEntryIds,\n                            newEntryProposals\n                        ) {\n                            testerProgressStats(\n                                validatedIds = reviewStore.all()\n                                    .asSequence()\n                                    .filter { it.action == ReviewActionType.VALIDATED }\n                                    .map { it.entryId }\n                                    .toSet() + validationStore.ids(),\n                                correctedIds = correctedEntryIds,\n                                deletionIds = deletionProposalEntryIds,\n                                newEntryCount = newEntryProposals.size\n                            )\n                        }''',
              'memoize progress stats'
          )

          p.write_text(s)
          PY

          cat > app/src/test/java/com/saamaka/dico/testeurs/TesterWorkflowPerformanceTest.kt <<'EOF'
          package com.saamaka.dico.testeurs

          import org.junit.Assert.assertEquals
          import org.junit.Test

          class TesterWorkflowPerformanceTest {
              @Test
              fun `adjacent lookup remains stable for large navigation context`() {
                  val ids = (1..10_000).toList()
                  assertEquals(5001, adjacentEntryId(ids, 5000, 1))
                  assertEquals(4999, adjacentEntryId(ids, 5000, -1))
              }
          }
          EOF

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin

      - name: Verify protected files unchanged
        run: |
          test -z "$(git diff --name-only HEAD -- app/build.gradle.kts app/src/main/assets app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt)"

      - name: Commit implementation
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt app/src/test/java/com/saamaka/dico/testeurs/TesterWorkflowPerformanceTest.kt
          git commit -m "perf(tester): reduce detail screen recomposition work"
          git push origin chatgpt/fix-tester-anr
