name: Verify Android

on:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/verify-android.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug build
        run: ./gradlew assembleDebug
