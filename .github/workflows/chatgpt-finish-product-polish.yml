            listOf(entry(1), entry(2, valide = "D"), entry(3), entry(4), entry(5, category = "")),
            correctedEntryIds = setOf(3),
            deletionProposalEntryIds = setOf(4)
        )
        assertEquals(listOf(1), result.map { it.id })
    }
}
''', encoding='utf-8')
