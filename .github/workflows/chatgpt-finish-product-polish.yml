name: ChatGPT finish product polish

on:
  push:
    paths:
      - '.github/workflows/chatgpt-finish-product-polish.yml'
      - '.github/scripts/final_polish.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply changes
        run: python3 .github/scripts/final_polish.py
      - name: Test
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleRelease --no-daemon
      - name: Verify protected files
        run: git diff --exit-code HEAD -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Commit
        run: |
          rm -f .github/workflows/chatgpt-finish-product-polish.yml .github/scripts/final_polish.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add -A
          git commit -m "feat(app): harden learning access and library UX"
          git push origin HEAD:master
