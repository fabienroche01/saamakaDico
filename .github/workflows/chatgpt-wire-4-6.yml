name: ChatGPT wire 4 to 6
on:
  push:
    branches: ["master"]
    paths: [".github/workflows/chatgpt-wire-4-6.yml"]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch MainActivity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt')
          s=p.read_text()
          s=s.replace('MainTab.FAVORITES -> SavedScreen(', 'MainTab.FAVORITES -> EnhancedSavedScreen(', 1)
          s=s.replace('MainTab.HISTORY -> HistoryScreen(', 'MainTab.HISTORY -> EnhancedHistoryScreen(', 1)
          cards='''                                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                                    LearnAccessCard(appStrings.reviewFavorites, "${favoriteLearningEntries.size} ${appStrings.favorites.lowercase()}", "FAVORITES", learnSection, Modifier.weight(1f), ::launchLearningActivity)\n                                    LearnAccessCard(appStrings.learningWordOfDay, appStrings.ui(UiCopyKey.REVIEW_VOCABULARY), "WORD_OF_DAY", learnSection, Modifier.weight(1f), ::launchLearningActivity)\n                                }\n'''
          if cards not in s: raise SystemExit('learning card anchor not found')
          s=s.replace(cards, cards+'''                                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                                    LearnAccessCard("Quiz audio", appStrings.listen.replace("▶", "").trim(), "AUDIO", learnSection, Modifier.weight(1f), ::launchLearningActivity)\n                                    Spacer(Modifier.weight(1f))\n                                }\n''',1)
          s=s.replace('''                                "FAVORITES", "WORD_OF_DAY" -> LearningActivity.REVIEW\n''','''                                "FAVORITES", "WORD_OF_DAY", "AUDIO" -> LearningActivity.REVIEW\n''',1)
          anchor='''                                "FAVORITES" -> {\n'''
          if anchor not in s: raise SystemExit('learning branch anchor not found')
          branch='''                                "AUDIO" -> {\n                                    AudioLearningSection(\n                                        strings = appStrings,\n                                        entries = quizEntries,\n                                        audioStore = audioStore,\n                                        onConsumeTrial = { consumeLearningTrialOrOpenPremium(LearningActivity.REVIEW) }\n                                    )\n                                }\n\n'''
          s=s.replace(anchor,branch+anchor,1)
          p.write_text(s)
          PY
      - name: Run tests
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin --no-daemon
      - name: Verify protected files unchanged
        shell: bash
        run: test -z "$(git diff --name-only -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt)"
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-wire-4-6.yml .github/workflows/chatgpt-library-learning-4-6.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add app/src/main/java/com/saamaka/dico/testeurs/MainActivity.kt app/src/main/java/com/saamaka/dico/testeurs/LibraryLearningEnhancements.kt .github/workflows/chatgpt-wire-4-6.yml .github/workflows/chatgpt-library-learning-4-6.yml
          git commit -m "feat(app): finish favorites history and audio learning"
          git push origin master
