name: ChatGPT verify final quality enhancements

on:
  push:
    paths:
      - '.github/workflows/chatgpt-quality-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleRelease --no-daemon
      - name: Verify protected files
        run: git diff --exit-code HEAD -- app/build.gradle.kts app/src/main/assets/SaamakaDico_v11_25.db app/src/main/java/com/saamaka/dico/testeurs/database/DictionaryDatabase.kt
      - name: Remove helper
        run: |
          rm .github/workflows/chatgpt-quality-check.yml
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add -A
          git commit -m "chore: remove quality verification helper"
          git push origin HEAD:master
